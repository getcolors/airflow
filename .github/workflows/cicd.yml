# Mirrors getcolors/k3s, which is the most recent green-only package and the
# closest sibling. The three steps are deliberately the three harnesses, because
# none of them subsumes another:
#
#   bb test              the couplings a build cannot exercise — most of what an
#                        ONCE pin bump would break, since a build never runs a
#                        create
#   bb golden            10 provider variants diffed against committed output,
#                        plus 15 assertions about the reuse surface
#   scripts/launcher.sh  the copied payload, in environments this checkout is
#                        not — no bb.edn beside it, nothing on the classpath,
#                        an unstamped pin
#
# `bb golden` resolves `once` and `green` from the git SHAs in deps.edn, so this
# job is what notices a pin bump changing rendered output. Never accept a golden
# to make CI pass without reading why it moved.
name: Test and Tag

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest
      - name: Unit tests
        run: bb test
      - name: Golden render
        run: bb golden
      - name: Launcher resolution
        run: ./scripts/launcher.sh

  tag:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create immutable revision tag
        run: |
          count=$(git rev-list --count HEAD)
          tag="1.0.${count}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            [ "$remote_sha" = "$local_sha" ] && exit 0
            echo "::error::Refusing to move existing tag ${tag}"; exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
