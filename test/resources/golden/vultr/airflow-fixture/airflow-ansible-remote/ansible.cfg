[defaults]
allow_world_readable_tmpfiles = True
interpreter_python = auto_silent
inventory = inventory.json
host_key_checking = False
force_color = True
gathering = explicit

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
# Not optional here, unlike the two packages this is copied from. Several tasks
# below carry a credential in their arguments or their stdin, and pipelining is
# what keeps the module — and therefore the credential — off the machine's disk
# entirely. allow_world_readable_tmpfiles above exists for `become_user:
# postgres`, and the two together would otherwise put a password in a
# world-readable temp file.
pipelining = True
